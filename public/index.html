<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Local Deals & Offers in Mumbra | FaydaPoint</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/logo.png" type="image/png" sizes="96x96" />
    <meta property="og:site_name" content="FaydaPoint">
    <meta
      name="description"
      content="Find exclusive, verified local deals and offers from nearby shops in Mumbra. Use coupons instantly. No signup required."
    />
    <meta name="theme-color" content="#FF6B00" />
    <script>
      if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.classList.add("dark");
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "FaydaPoint",
        "url": "https://faydapoint.com/"
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "FaydaPoint",
        "url": "https://faydapoint.com/",
        "logo": "https://faydapoint.com/icons/icon-512.png"
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="%REACT_APP_API_BASE_URL%" crossorigin />
    <style>
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      html {
        scroll-behavior: smooth;
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>

  <body>
    <!-- STATIC HTML SKELETON (OVERLAY ONLY) -->
    <div id="html-skeleton">
      <!-- HEADER PLACEHOLDER (matches MobileHeader) -->
      <div class="sk-header"></div>

      <!-- FEED PLACEHOLDER -->
      <div class="sk-container">
        <div class="sk-card"></div>
        <div class="sk-card"></div>
        <div class="sk-card"></div>
      </div>
    </div>

    <!-- REACT ROOT -->
    <div id="root"></div>

    <style>
      /* =============================
       GLOBAL RESET (SAFE)
       ============================= */
      body {
        margin: 0;
        background: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      /* =============================
       SKELETON OVERLAY (CRITICAL)
       ============================= */
      #html-skeleton {
        position: fixed; /* 🔥 prevents CLS */
        inset: 0;
        background: #f2f0f2;
        z-index: 9999;
        pointer-events: none;
      }

      /* =============================
       HEADER SKELETON
       (matches h-14 / 56px)
       ============================= */
      .sk-header {
        height: 56px; /* EXACT match */
        background: #ffffff;
        border-bottom: 1px solid #eee;
      }

      /* =============================
       FEED CONTAINER
       ============================= */
      .sk-container {
        padding: 16px;
      }

      /* =============================
       FEED CARD SKELETON
       Matches FeedCampaignCard
       ============================= */
      .sk-card {
        height: 150px; /* 🔥 overshoot real card */
        background: #e5e5ea;
        border-radius: 16px;
        margin-bottom: 12px;
        animation: pulse 1.4s ease-in-out infinite;
      }

      @keyframes pulse {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
        100% {
          opacity: 1;
        }
      }
    </style>
  </body>
</html>
